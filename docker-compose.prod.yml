# Produção na VPS (DigitalOcean Droplet) + Managed Postgres
# Uso: docker compose -f docker-compose.prod.yml --env-file .env up -d --build
services:
  api:
    build: .
    container_name: montwhats-api
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      PORT: 3000
      SESSIONS_PATH: /data/sessions
      NODE_ENV: production
    volumes:
      - sessions_data:/data/sessions
      # Opcional: coloque o CA da DO em ./certs/ca-certificate.crt
      # e no .env: DATABASE_CA_PATH=/certs/ca-certificate.crt
      - ./certs:/certs:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # HTTPS opcional: defina DOMAIN=api.seudominio.com no .env
  caddy:
    image: caddy:2-alpine
    container_name: montwhats-caddy
    profiles: ["https"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sessions_data:
  caddy_data:
  caddy_config:
